<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="35%" stop-color="#1e1b4b" />
      <stop offset="65%" stop-color="#3b0764" />
      <stop offset="85%" stop-color="#831843" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="25%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sunDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>

    <linearGradient id="mountBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="100%" stop-color="#110726" />
    </linearGradient>

    <linearGradient id="mountMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>

    <linearGradient id="mountFore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="600" fill="url(#skyGrad)" />

  <!-- Stars / Distant Sparkles -->
  <g opacity="0.6">
    <circle cx="120" cy="80" r="1.5" fill="#fff" opacity="0.8" />
    <circle cx="280" cy="60" r="1" fill="#fff" opacity="0.5" />
    <circle cx="450" cy="90" r="2" fill="#fff" opacity="0.9" />
    <circle cx="680" cy="70" r="1.5" fill="#fff" opacity="0.7" />
    <circle cx="730" cy="130" r="1" fill="#fff" opacity="0.6" />
    <circle cx="90" cy="160" r="1.2" fill="#fff" opacity="0.4" />
    <circle cx="340" cy="140" r="1.5" fill="#fff" opacity="0.7" />
    <circle cx="590" cy="110" r="1" fill="#fff" opacity="0.5" />
  </g>

  <!-- Giant Radiant Sun Aura -->
  <circle cx="400" cy="330" r="260" fill="url(#sunGlow)" />
  
  <!-- Sun Disc -->
  <circle cx="400" cy="310" r="75" fill="url(#sunDisc)" />

  <!-- Sun Rays Flare -->
  <g opacity="0.35">
    <line x1="400" y1="310" x2="200" y2="100" stroke="#fde047" stroke-width="1.5" stroke-dasharray="8 6" />
    <line x1="400" y1="310" x2="600" y2="100" stroke="#fde047" stroke-width="1.5" stroke-dasharray="8 6" />
    <line x1="400" y1="310" x2="400" y2="60" stroke="#fde047" stroke-width="2" stroke-dasharray="10 8" />
    <line x1="400" y1="310" x2="150" y2="280" stroke="#fde047" stroke-width="1.5" stroke-dasharray="6 6" />
    <line x1="400" y1="310" x2="650" y2="280" stroke="#fde047" stroke-width="1.5" stroke-dasharray="6 6" />
  </g>

  <!-- Distant Mountain Ridge -->
  <polygon points="0,420 110,340 230,380 340,320 400,340 480,290 620,370 730,310 800,360 800,600 0,600" fill="url(#mountBack)" opacity="0.7" />

  <!-- Mid Mountain Range with Ridge Highlight -->
  <polygon points="0,470 140,380 270,430 420,350 560,420 690,360 800,430 800,600 0,600" fill="url(#mountMid)" />
  <polyline points="0,470 140,380 270,430 420,350 560,420 690,360 800,430" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.4" />

  <!-- Topo / GPS Grid Contour Lines -->
  <path d="M -50,490 Q 200,430 400,460 T 850,440" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 6" />
  <path d="M -50,530 Q 250,470 420,500 T 850,480" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="6 8" />

  <!-- Foreground Alpine Summit Ridge -->
  <polygon points="0,530 180,480 320,510 400,440 500,490 640,460 800,520 800,600 0,600" fill="url(#mountFore)" />

  <!-- Glowing Finish Line Ribbon Arch & Banner -->
  <g>
    <path d="M 310,470 Q 400,430 490,470" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" />
    <path d="M 320,476 Q 400,438 480,476" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Luminous Finish Line Floating Particles -->
  <g opacity="0.85">
    <circle cx="340" cy="445" r="2.5" fill="#34d399" />
    <circle cx="460" cy="440" r="3" fill="#38bdf8" />
    <circle cx="380" cy="415" r="2" fill="#fbbf24" />
    <circle cx="420" cy="410" r="2.5" fill="#f472b6" />
    <circle cx="310" cy="460" r="1.5" fill="#a7f3d0" />
    <circle cx="490" cy="455" r="2" fill="#fde047" />
  </g>

  <!-- Victorious Runner Silhouette at Summit (Arms Raised in Triumph) -->
  <g transform="translate(400, 440)">
    <!-- Runner Shadow / Glow on Ground -->
    <ellipse cx="0" cy="0" rx="36" ry="7" fill="#10b981" opacity="0.3" />
    
    <!-- Silhouette Body -->
    <!-- Head -->
    <circle cx="0" cy="-66" r="8.5" fill="#ffffff" />
    <!-- Neck -->
    <path d="M -2.5,-58 L 2.5,-58 L 3,-53 L -3,-53 Z" fill="#ffffff" />
    <!-- Torso -->
    <path d="M -11,-53 L 11,-53 L 8,-24 L -8,-24 Z" fill="#ffffff" />
    <!-- Left Arm Raised Victorious V -->
    <path d="M -10,-51 L -28,-72 L -23,-75 L -6,-51 Z" fill="#ffffff" />
    <!-- Right Arm Raised Victorious V -->
    <path d="M 10,-51 L 28,-72 L 23,-75 L 6,-51 Z" fill="#ffffff" />
    <!-- Left Leg in Stride -->
    <path d="M -8,-24 L -18,-2 L -12,0 L -3,-24 Z" fill="#ffffff" />
    <!-- Right Leg in Stride -->
    <path d="M 8,-24 L 16,-6 L 22,-4 L 3,-24 Z" fill="#ffffff" />
    
    <!-- Neon Accent on Silhouette -->
    <path d="M -28,-72 L 0,-40 L 28,-72" fill="none" stroke="#10b981" stroke-width="2" opacity="0.9" />
  </g>

  <!-- Tech HUD Overlay Elements -->
  <g transform="translate(40, 40)" opacity="0.85">
    <rect width="130" height="28" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="28" y="18" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SUMMIT FINISH</text>
  </g>

  <g transform="translate(640, 40)" opacity="0.85">
    <rect width="120" height="28" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="60" y="18" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">ELEV. 2,450M</text>
  </g>

  <!-- GPS Glowing Pace Route line across bottom -->
  <path d="M 100,560 L 220,535 L 360,545 L 400,505 L 480,520 L 620,540 L 720,555" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-linecap="round" />
  <circle cx="400" cy="505" r="4" fill="#ffffff" stroke="#10b981" stroke-width="2" />
</svg>
