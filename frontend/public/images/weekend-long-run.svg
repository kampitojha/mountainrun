<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090a1a" />
      <stop offset="35%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="topoGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <linearGradient id="ridgeFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="ridgeMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="ridgeClose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="800" height="600" fill="url(#twilightSky)" />

  <!-- Constellations & Stars -->
  <g opacity="0.6">
    <circle cx="150" cy="70" r="1.5" fill="#fff" />
    <circle cx="210" cy="50" r="2" fill="#38bdf8" />
    <circle cx="280" cy="90" r="1.5" fill="#fff" />
    <circle cx="550" cy="60" r="1.5" fill="#fff" />
    <circle cx="630" cy="40" r="2.5" fill="#a7f3d0" />
    <circle cx="700" cy="80" r="1.5" fill="#fff" />
    <line x1="150" y1="70" x2="210" y2="50" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="210" y1="50" x2="280" y2="90" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.5" />
  </g>

  <!-- Giant Moon / High Altitude Orb -->
  <circle cx="640" cy="140" r="70" fill="url(#moonGlow)" />
  <circle cx="640" cy="140" r="45" fill="#f8fafc" opacity="0.95" />

  <!-- Distant Alpine Mountain Massif -->
  <polygon points="0,320 120,240 240,290 380,200 490,260 620,180 720,230 800,190 800,600 0,600" fill="url(#ridgeFar)" opacity="0.7" />

  <!-- Snow Tops on Distant Massif -->
  <polygon points="380,200 360,225 375,230 380,220 395,235 410,225" fill="#e0e7ff" opacity="0.8" />
  <polygon points="620,180 600,210 615,215 625,205 640,220 655,205" fill="#e0e7ff" opacity="0.8" />

  <!-- Mid Range Mountain Contour -->
  <polygon points="0,400 160,330 310,380 440,310 590,370 710,320 800,380 800,600 0,600" fill="url(#ridgeMid)" />

  <!-- Topo Map Contour Curves (High-Tech Vector Elevation Rings) -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="1" fill="none">
    <path d="M 0,380 C 150,340 280,410 450,360 S 700,340 800,390" />
    <path d="M 0,420 C 180,380 320,440 480,400 S 680,390 800,430" />
    <path d="M 0,460 C 200,420 360,470 520,440 S 720,430 800,470" />
    <path d="M 0,500 C 220,460 400,510 560,480 S 740,470 800,510" />
  </g>

  <!-- Foreground Alpine Ridge Trail Pathway -->
  <polygon points="0,480 180,420 340,460 480,390 640,430 800,380 800,600 0,600" fill="url(#ridgeClose)" />

  <!-- Glowing GPS Elevation Path Profile (Luminescent trail) -->
  <path d="M 50,530 Q 180,470 320,480 T 480,410 T 640,435 T 780,400" fill="none" stroke="url(#topoGreen)" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <path d="M 50,530 Q 180,470 320,480 T 480,410 T 640,435 T 780,400" fill="none" stroke="url(#topoGreen)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 50,530 Q 180,470 320,480 T 480,410 T 640,435 T 780,400" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />

  <!-- Waypoint Markers along Trail -->
  <!-- 5 KM Pin -->
  <g transform="translate(180, 475)">
    <circle cx="0" cy="0" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    <rect x="-18" y="-24" width="36" height="16" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="-13" fill="#38bdf8" font-family="sans-serif" font-size="8" font-weight="800" text-anchor="middle">5 KM</text>
  </g>

  <!-- 10 KM Pin -->
  <g transform="translate(320, 480)">
    <circle cx="0" cy="0" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
    <rect x="-20" y="-24" width="40" height="16" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="0" y="-13" fill="#10b981" font-family="sans-serif" font-size="8" font-weight="800" text-anchor="middle">10 KM</text>
  </g>

  <!-- 15 KM Pin -->
  <g transform="translate(480, 410)">
    <circle cx="0" cy="0" r="5" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />
    <rect x="-20" y="-24" width="40" height="16" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1" />
    <text x="0" y="-13" fill="#fbbf24" font-family="sans-serif" font-size="8" font-weight="800" text-anchor="middle">15 KM</text>
  </g>

  <!-- 21 KM Half Marathon Summit Goal -->
  <g transform="translate(640, 435)">
    <circle cx="0" cy="0" r="7" fill="#a855f7" stroke="#ffffff" stroke-width="2" />
    <rect x="-30" y="-28" width="60" height="20" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
    <text x="0" y="-15" fill="#e9d5ff" font-family="sans-serif" font-size="9" font-weight="900" text-anchor="middle">21.1 KM 🏁</text>
  </g>

  <!-- Solo Ultra-Runner Silhouette traversing the ridge -->
  <g transform="translate(480, 405)">
    <ellipse cx="0" cy="0" rx="20" ry="4" fill="#000" opacity="0.5" />
    <!-- Running Figure With Hydration Pack -->
    <circle cx="6" cy="-48" r="6.5" fill="#ffffff" />
    <!-- Cap Brim -->
    <path d="M 6,-50 L 14,-49 L 12,-46 Z" fill="#38bdf8" />
    <!-- Torso + Hydration Vest -->
    <path d="M 0,-40 L 10,-38 L 4,-10 L -4,-12 Z" fill="#ffffff" />
    <rect x="-7" y="-38" width="5" height="16" rx="2" fill="#38bdf8" />
    <!-- Arms in Motion -->
    <path d="M 6,-35 L 18,-24 L 26,-32" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -2,-34 L -14,-22 L -20,-12" fill="none" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Legs in Trail Cadence -->
    <path d="M 4,-10 L 16,12 L 28,38" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -4,-12 L -18,8 L -30,22" fill="none" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Live Telemetry Card Overlay Bottom Left -->
  <g transform="translate(40, 480)">
    <rect width="210" height="74" rx="18" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="28" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1">WEEKEND LONG RUN</text>
    <text x="20" y="52" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="900">21.1 KM</text>
    <text x="115" y="52" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">+680m ELEV</text>
  </g>

  <!-- Verification Badge Bottom Right -->
  <g transform="translate(610, 490)">
    <rect width="150" height="60" rx="16" fill="#0f172a" fill-opacity="0.95" stroke="#10b981" stroke-width="1.5" />
    <circle cx="28" cy="30" r="12" fill="#10b981" fill-opacity="0.2" />
    <path d="M 23,30 L 27,34 L 34,26" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <text x="48" y="27" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="800">GPS VERIFIED</text>
    <text x="48" y="44" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">Official Result</text>
  </g>
</svg>
