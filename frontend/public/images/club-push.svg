<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#06202a" />
      <stop offset="75%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="speedTrailCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="speedTrailEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="speedTrailAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="80%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fffbeb" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="runnerGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <linearGradient id="runnerGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="runnerGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Aurora Waves -->
  <path d="M 0,220 Q 200,120 400,200 T 800,160 L 800,0 L 0,0 Z" fill="url(#auroraGlow)" />
  <path d="M 0,280 Q 240,160 480,240 T 800,200 L 800,0 L 0,0 Z" fill="url(#auroraGlow)" opacity="0.6" />

  <!-- Mountain Silhouettes in Background -->
  <polygon points="0,380 90,320 200,360 310,290 420,340 540,280 660,330 750,300 800,340 800,600 0,600" fill="#0f172a" opacity="0.6" />
  <polygon points="0,420 120,360 250,400 380,330 500,390 620,340 740,410 800,370 800,600 0,600" fill="#061f23" opacity="0.8" />

  <!-- Mountain Road Perspective Grid -->
  <polygon points="120,600 360,390 440,390 680,600" fill="url(#roadGrad)" />
  <polyline points="400,390 400,600" stroke="#10b981" stroke-width="3" stroke-dasharray="24 16" opacity="0.8" />

  <!-- Road Border Neon Guidance Lines -->
  <line x1="360" y1="390" x2="120" y2="600" stroke="#06b6d4" stroke-width="2.5" opacity="0.7" />
  <line x1="440" y1="390" x2="680" y2="600" stroke="#06b6d4" stroke-width="2.5" opacity="0.7" />

  <!-- Speed Streamlines / Dynamic Streaks -->
  <g>
    <path d="M 50,450 L 260,450" stroke="url(#speedTrailEmerald)" stroke-width="3" stroke-linecap="round" />
    <path d="M 80,480 L 380,480" stroke="url(#speedTrailCyan)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 30,520 L 480,520" stroke="url(#speedTrailAmber)" stroke-width="4" stroke-linecap="round" />
    <path d="M 550,470 L 750,470" stroke="url(#speedTrailEmerald)" stroke-width="2" stroke-linecap="round" />
    <path d="M 460,530 L 780,530" stroke="url(#speedTrailCyan)" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Group / Team Runners (Pack Dynamics) -->
  
  <!-- Runner 1: Front Leader (Center-Right) -->
  <g transform="translate(480, 430)">
    <!-- Shadow -->
    <ellipse cx="0" cy="80" rx="30" ry="6" fill="#000" opacity="0.4" />
    <!-- Dynamic Runner Pose (Forward lean sprint) -->
    <!-- Head -->
    <circle cx="22" cy="-45" r="9" fill="url(#runnerGrad1)" />
    <!-- Torso -->
    <path d="M 12,-35 L 25,-32 L 8,10 L -4,7 Z" fill="url(#runnerGrad1)" />
    <!-- Front Arm -->
    <path d="M 22,-30 L 38,-15 L 48,-28" fill="none" stroke="url(#runnerGrad1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Back Arm -->
    <path d="M 10,-28 L -10,-12 L -20,-2" fill="none" stroke="url(#runnerGrad1)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <!-- Front Leg (Extended Forward Knee Up) -->
    <path d="M 6,10 L 28,38 L 46,75" fill="none" stroke="url(#runnerGrad1)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Back Leg (Trailing Push-off) -->
    <path d="M -2,8 L -24,40 L -42,62" fill="none" stroke="url(#runnerGrad1)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Neon energy outline -->
    <path d="M -42,62 L -24,40 L 6,10 L 28,38 L 46,75" fill="none" stroke="#10b981" stroke-width="2" opacity="0.9" />
  </g>

  <!-- Runner 2: Co-Leader (Center-Left) -->
  <g transform="translate(350, 420)">
    <ellipse cx="0" cy="80" rx="28" ry="5" fill="#000" opacity="0.4" />
    <circle cx="20" cy="-45" r="8.5" fill="url(#runnerGrad2)" />
    <path d="M 10,-35 L 23,-32 L 6,10 L -6,7 Z" fill="url(#runnerGrad2)" />
    <path d="M 20,-30 L 36,-18 L 44,-32" fill="none" stroke="url(#runnerGrad2)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 8,-28 L -12,-15 L -22,-5" fill="none" stroke="url(#runnerGrad2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <path d="M 4,10 L 24,35 L 42,72" fill="none" stroke="url(#runnerGrad2)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -4,8 L -26,38 L -44,58" fill="none" stroke="url(#runnerGrad2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -44,58 L -26,38 L 4,10 L 24,35 L 42,72" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.9" />
  </g>

  <!-- Runner 3: Pack Teammate (Mid Center-Behind) -->
  <g transform="translate(410, 390) scale(0.85)">
    <circle cx="18" cy="-45" r="8" fill="url(#runnerGrad3)" />
    <path d="M 8,-35 L 21,-32 L 4,10 L -6,7 Z" fill="url(#runnerGrad3)" />
    <path d="M 18,-30 L 32,-16 L 40,-28" fill="none" stroke="url(#runnerGrad3)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 2,10 L 20,32 L 36,68" fill="none" stroke="url(#runnerGrad3)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -4,8 L -22,34 L -38,54" fill="none" stroke="url(#runnerGrad3)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -38,54 L -22,34 L 2,10 L 20,32 L 36,68" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.9" />
  </g>

  <!-- Runner 4: Pack Teammate (Left Wing) -->
  <g transform="translate(250, 445) scale(0.9)">
    <circle cx="20" cy="-45" r="8" fill="#e2e8f0" />
    <path d="M 10,-35 L 23,-32 L 6,10 L -6,7 Z" fill="#cbd5e1" />
    <path d="M 4,10 L 24,35 L 42,72" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -4,8 L -26,38 L -44,58" fill="none" stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Runner 5: Pack Teammate (Right Wing) -->
  <g transform="translate(580, 450) scale(0.92)">
    <circle cx="20" cy="-45" r="8" fill="#e2e8f0" />
    <path d="M 10,-35 L 23,-32 L 6,10 L -6,7 Z" fill="#cbd5e1" />
    <path d="M 4,10 L 24,35 L 42,72" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -4,8 L -26,38 L -44,58" fill="none" stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Futuristic ECG / Leaderboard Pulse Overlay -->
  <g>
    <path d="M 50,280 L 220,280 L 240,250 L 260,310 L 280,270 L 300,280 L 520,280 L 540,240 L 560,320 L 580,265 L 600,280 L 750,280" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6" />
  </g>

  <!-- HUD Badges -->
  <g transform="translate(40, 40)">
    <rect width="145" height="28" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#059669" stroke-width="1.2" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="28" y="18" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">LEADERBOARD PUSH</text>
  </g>

  <g transform="translate(620, 40)">
    <rect width="140" height="28" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#0284c7" stroke-width="1.2" />
    <text x="70" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">PACE 4:15 / KM</text>
  </g>
</svg>
